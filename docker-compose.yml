name: shop

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  # One-off: `docker compose --profile tools run --rm db-bootstrap` applies migrations and seeds the
  # database without starting the api. (The api container runs the same command on start-up.)
  db-bootstrap:
    profiles: ['tools']
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUN_SEED: ${RUN_SEED:-true}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      # the stub posts its signed notifications back to this very container
      WEBHOOK_URL: http://127.0.0.1:${API_PORT:-4000}/payments/webhook
    expose:
      - '${API_PORT:-4000}' # reachable only inside the compose network, the public entry is nginx
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:${API_PORT:-4000}/health']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:${API_PORT:-4000}
    restart: unless-stopped
    environment:
      PORT: ${WEB_PORT:-3000}
      HOSTNAME: 0.0.0.0
    expose:
      - '${WEB_PORT:-3000}' # reachable only inside the compose network, the public entry is nginx
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:${WEB_PORT:-3000}/uk/login']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '${NGINX_HOST_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/api/health']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
