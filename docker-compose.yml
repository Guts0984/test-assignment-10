name: shop

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  # One-off: `docker compose --profile tools run --rm db-bootstrap` applies migrations and seeds the
  # database without starting the api. (The api container runs the same command on start-up.)
  db-bootstrap:
    profiles: ['tools']
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUN_SEED: ${RUN_SEED:-true}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
