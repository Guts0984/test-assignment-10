worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  # --- abuse protection in FRONT of the application (the api has its own PostgreSQL limiter too) ---
  # one bucket per client address; /api/ only, so loading a page's static assets never trips it
  limit_req_zone  $binary_remote_addr zone=api_per_ip:10m   rate=40r/s;
  limit_req_zone  $binary_remote_addr zone=login_per_ip:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  limit_req_status  429;
  limit_conn_status 429;

  # slow-client protection
  client_header_timeout 10s;
  client_body_timeout   10s;
  send_timeout          30s;
  keepalive_timeout     30s;
  client_max_body_size  200k;

  upstream api_upstream { server api:4000; keepalive 16; }
  upstream web_upstream { server web:3000; keepalive 16; }

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  server {
    listen 80;
    server_name _;

    # the api also sets nosniff: hide the upstream copy so every response carries each header exactly once
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    limit_conn conn_per_ip 50;

    # The edge: whatever X-Forwarded-For the client sent is DISCARDED and replaced with the address nginx
    # really saw. The api trusts exactly one hop (TRUST_PROXY_HOPS=1) and takes the last entry.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    location = /api/auth/login {
      limit_req zone=login_per_ip burst=10 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api_upstream;
    }

    # ^~ : once this prefix matches, the regex location below is not consulted for it
    location ^~ /api/ {
      limit_req zone=api_per_ip burst=80 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api_upstream;
    }

    # EVERY other spelling of the api prefix (/API/..., /Api/x, /api without a slash, /API/./auth/login)
    # is a 404. Without this, such a path fell through to the web app, whose own rewrite is
    # case-insensitive: it would have reached the api WITHOUT passing the limits above, and the api
    # would have counted it under the web container's address instead of the client's.
    location ~* ^/api(/|$) {
      return 404;
    }

    # Swagger UI and its JSON
    location ~ ^/(docs|docs-json)(/|$) {
      proxy_pass http://api_upstream;
    }

    location / {
      proxy_pass http://web_upstream;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
